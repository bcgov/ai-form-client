name: Deploy Tenant Reusable

on:
  workflow_call:
    inputs:
      tenant:
        description: Tenant key (matches src/tenant/<tenant> folder name)
        required: true
        type: string
      deployment_environment:
        description: Shared GitHub environment name (dev, test, prod)
        required: true
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload Tenant Script
        run: |
          az storage blob upload \
            --auth-mode login \
            --account-name "${{ secrets.STORAGE_ACCOUNT_NAME }}" \
            --container-name '$web' \
            --file "src/tenant/${{ inputs.tenant }}/client.js" \
            --name "scripts/tenants/${{ inputs.tenant }}/client.js" \
            --overwrite

      - name: Upload Tenant Assets
        run: |
          az storage blob sync \
            --auth-mode login \
            --account-name "${{ secrets.STORAGE_ACCOUNT_NAME }}" \
            --container 'assets' \
            --source "src/tenant/${{ inputs.tenant }}/assets" \
            --destination "tenants/${{ inputs.tenant }}" \
            --delete-destination false

